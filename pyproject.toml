[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umich-api"
version = "4.0.0"
description = "Python Umich API Utilities"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "University of Michigan Teaching and Learning Developers" }]
requires-python = ">=3.11"
dependencies = [
	"autologging>=1.3.2,<2.0.0",
	"ratelimit>=2.2.0,<3.0.0",
	"requests>=2.31.0,<3.0.0",
]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.11",
	"License :: OSI Approved :: Apache Software License",
	"Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/tl-its-umich-edu/api-utils-python"

[project.optional-dependencies]
test = [
	"pytest>=8.0.0,<9.0.0",
	"python-dotenv>=1.0.0,<2.0.0",
]

[tool.setuptools]
packages = ["umich_api"]
include-package-data = true

[tool.setuptools.package-data]
umich_api = ["apis.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
